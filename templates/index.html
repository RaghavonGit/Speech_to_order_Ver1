<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-System | Voice Command</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & CORE --- */
        :root {
            --glass-bg: rgba(10, 10, 10, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow-white: rgba(255, 255, 255, 0.8);
            --neon-accent: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace; /* Tech font */
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Prevent scroll on body, scroll inside card if needed */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
        }

        /* --- ANIMATED BACKGROUND --- */
        .ambient-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, #222 0%, #000 70%);
            z-index: -2;
            animation: deep-pulse 10s ease-in-out infinite alternate;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 3px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
        }

        /* --- MAIN INTERFACE CARD --- */
        .interface-container {
            position: relative;
            width: 420px;
            max-height: 90vh;
            overflow-y: auto; /* Allow scroll if list is long */
            padding: 40px;
            border-radius: 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 0 0 1px rgba(0,0,0,1),
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 10;
            transition: all 0.3s ease;
        }
        
        /* Hide scrollbar for sleekness */
        .interface-container::-webkit-scrollbar { width: 0px; background: transparent; }

        /* --- VISUALIZER --- */
        .visualizer-container {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .visualizer {
            display: flex;
            gap: 6px;
            align-items: center;
            height: 100%;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        
        .visualizer.active { opacity: 1; }

        .bar {
            width: 4px;
            background-color: #fff;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            animation: equalize 1s ease-in-out infinite;
        }
        /* Stagger animations */
        .bar:nth-child(1) { height: 10px; animation-duration: 0.8s; }
        .bar:nth-child(2) { height: 20px; animation-duration: 1.1s; }
        .bar:nth-child(3) { height: 15px; animation-duration: 0.9s; }
        .bar:nth-child(4) { height: 25px; animation-duration: 1.3s; }
        .bar:nth-child(5) { height: 8px; animation-duration: 0.7s; }

        /* --- TABS --- */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.4);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- VIEWS --- */
        .view-content { display: none; animation: fadeIn 0.4s ease; }
        .view-content.active { display: block; }

        /* View 1: Mic Button */
        .mic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
        }

        .mic-button-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .mic-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a1a1a, #000);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
        }

        .mic-icon {
            width: 24px; height: 24px; fill: #fff;
            transition: all 0.3s;
        }

        .mic-button-wrapper:hover .mic-circle, .mic-button-wrapper.recording .mic-circle {
            background: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.6);
        }
        
        .mic-button-wrapper:hover .mic-icon, .mic-button-wrapper.recording .mic-icon {
            fill: #000;
        }

        .mic-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.5);
            opacity: 0;
            z-index: 1;
        }

        .mic-button-wrapper.recording .mic-ring {
            animation: ripple 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }

        /* View 2 & 3: Inputs */
        .file-drop-area {
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-drop-area:hover {
            border-color: #fff;
            background: rgba(255,255,255,0.05);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            resize: none;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus { border-color: rgba(255,255,255,0.5); box-shadow: 0 0 10px rgba(255,255,255,0.1); }

        /* --- BUTTONS --- */
        .btn-action {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-action:hover {
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            transform: translateY(-1px);
        }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- STATUS TEXT --- */
        .status-text {
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            min-height: 20px;
            margin-top: 10px;
        }
        .status-text.error { color: #ff4444; text-shadow: 0 0 10px rgba(255,0,0,0.4); }
        .status-text.success { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.4); }

        /* --- RESULTS SECTION --- */
        #result-section {
            display: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
            margin-top: 10px;
            animation: slideUp 0.5s ease;
        }

        .result-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .lang-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .raw-text {
            font-size: 13px;
            color: var(--text-dim);
            font-style: italic;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 2px solid #fff;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .item-name { font-weight: 500; font-size: 14px; }
        .item-qty {
            background: #fff;
            color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .item-instr {
            font-size: 10px;
            color: #ff9999;
            display: block;
            margin-top: 3px;
        }

        /* --- AUDIO PLAYER --- */
        audio {
            width: 100%;
            height: 30px;
            margin-bottom: 15px;
            opacity: 0.8;
            border-radius: 5px;
        }
        /* Custom audio player styling is hard, using filter to grayscale it */
        audio::-webkit-media-controls-panel { background-color: #eee; }

        /* --- KEYFRAMES --- */
        @keyframes deep-pulse { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }
        @keyframes ripple { 0% { width: 70px; height: 70px; opacity: 0.8; border-width: 2px; } 100% { width: 140px; height: 140px; opacity: 0; border-width: 0px; } }
        @keyframes equalize { 0%, 100% { height: 4px; opacity: 0.3; } 50% { height: 100%; opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="ambient-bg"></div>
    <div class="scanlines"></div>

    <div class="interface-container">
        
        <div class="visualizer-container">
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab(1)">Live Mic</div>
            <div class="tab" onclick="switchTab(2)">Upload</div>
            <div class="tab" onclick="switchTab(3)">Text</div>
        </div>

        <div id="view1" class="view-content active">
            <div class="mic-container">
                <p style="font-size: 12px; color: var(--text-dim); text-transform: uppercase;">System Ready</p>
                
                <div id="micWrapper" class="mic-button-wrapper" onclick="toggleRecording()">
                    <div class="mic-circle">
                        <svg class="mic-icon" viewBox="0 0 24 24">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                        </svg>
                    </div>
                    <div class="mic-ring" style="animation-delay: 0s;"></div>
                    <div class="mic-ring" style="animation-delay: 0.5s;"></div>
                </div>

                <p id="recordText" style="font-size: 11px; letter-spacing: 1px; color: #fff;">TAP TO INITIALIZE</p>
            </div>
        </div>

        <div id="view2" class="view-content">
            <div class="file-drop-area" onclick="document.getElementById('fileInput').click()">
                <p style="font-size: 14px; margin-bottom: 5px;">Select Audio File</p>
                <p style="font-size: 10px; color: var(--text-dim);">.WAV .MP3 .M4A</p>
                <input type="file" id="fileInput" accept="audio/*" style="display:none" onchange="updateFileName()">
            </div>
            <p id="fileNameDisplay" style="text-align: center; font-size: 11px; margin: 10px 0; color: #fff;"></p>
            <button class="btn-action" onclick="uploadFile()">Analyze Data</button>
        </div>

        <div id="view3" class="view-content">
            <textarea id="textInput" placeholder="Input order text stream... (e.g. Rendu packet paal)"></textarea>
            <button class="btn-action" onclick="submitText()">Process Text</button>
        </div>

        <div id="statusMsg" class="status-text"></div>

        <div id="result-section">
            <div class="result-meta">
                <span style="font-size: 14px; font-weight: 600;">LOG OUTPUT</span>
                <span id="lang-badge" class="lang-badge">TAMIL</span>
            </div>

            <audio id="audio-player" controls style="display:none"></audio>
            
            <div id="raw-text-box" class="raw-text"></div>
            
            <div id="items-list">
                </div>
        </div>

    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioStream = null;

        // --- UI UTILS ---
        function switchTab(n) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n - 1));
            document.querySelectorAll('.view-content').forEach((c, i) => c.classList.toggle('active', i === n - 1));
            setStatus('');
        }

        function updateFileName() {
            const file = document.getElementById('fileInput').files[0];
            if (file) document.getElementById('fileNameDisplay').innerText = "> " + file.name;
        }

        function setStatus(msg, type='normal') {
            const el = document.getElementById('statusMsg');
            el.innerText = msg;
            el.className = 'status-text ' + type;
        }

        function toggleLoader(active) {
            const el = document.getElementById('statusMsg');
            if(active) {
                el.innerText = "PROCESSING DATA STREAM...";
                el.style.color = "#fff";
                el.style.textShadow = "0 0 10px white";
            }
        }

        // --- RECORDING ---
        async function toggleRecording() {
            const wrapper = document.getElementById('micWrapper');
            const txt = document.getElementById('recordText');
            const visualizer = document.getElementById('visualizer');

            if (!isRecording) {
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(audioStream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = sendRecordedAudio;
                    
                    mediaRecorder.start();
                    isRecording = true;
                    
                    // UI Updates
                    wrapper.classList.add('recording');
                    visualizer.classList.add('active');
                    txt.innerText = "LISTENING...";
                    setStatus("MICROPHONE ACTIVE", "success");
                    
                } catch (err) {
                    setStatus("ACCESS DENIED", "error");
                }
            } else {
                mediaRecorder.stop();
                audioStream.getTracks().forEach(track => track.stop());
                
                isRecording = false;
                
                // UI Updates
                wrapper.classList.remove('recording');
                visualizer.classList.remove('active');
                txt.innerText = "TAP TO INITIALIZE";
                toggleLoader(true);
            }
        }

        // --- API CALLS ---
        async function sendRecordedAudio() {
            const blob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append("audio", blob, "live_recording.wav");
            await sendData('/process_audio', formData);
        }

        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return setStatus("NO FILE SELECTED", "error");
            
            toggleLoader(true);
            const formData = new FormData();
            formData.append("audio", file);
            await sendData('/process_audio', formData);
        }

        async function submitText() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return setStatus("EMPTY INPUT", "error");
            
            toggleLoader(true);
            try {
                const res = await fetch('/process_text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                renderResults(data);
                setStatus("EXECUTION COMPLETE", "success");
            } catch (e) {
                setStatus("SYSTEM FAILURE", "error");
            }
        }

        async function sendData(url, body) {
            try {
                const res = await fetch(url, { method: 'POST', body });
                const data = await res.json();
                if (res.ok) {
                    renderResults(data);
                    setStatus("EXECUTION COMPLETE", "success");
                } else {
                    setStatus(data.error || "UNKNOWN ERROR", "error");
                }
            } catch (e) {
                setStatus("NETWORK FAILURE", "error");
            }
        }

        // --- RENDER RESULTS ---
        function renderResults(data) {
            const section = document.getElementById('result-section');
            const list = document.getElementById('items-list');
            
            section.style.display = 'block';
            
            // Badge
            document.getElementById('lang-badge').innerText = (data.language_detected || 'UNK').toUpperCase();
            
            // Text
            const displayText = data.translated_text ? data.translated_text : data.raw_input;
            document.getElementById('raw-text-box').innerHTML = `"${displayText}"`;

            // Audio
            const player = document.getElementById('audio-player');
            if (data.audio_url) {
                player.style.display = 'block';
                player.src = data.audio_url;
            } else {
                player.style.display = 'none';
            }

            // List
            list.innerHTML = '';
            if (!data.items || data.items.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:10px; color:var(--text-dim); font-size:12px;">NO DATA EXTRACTED</div>`;
                return;
            }

            data.items.forEach(item => {
                let instrHtml = '';
                if (item.instructions) {
                    const instrText = Array.isArray(item.instructions) ? item.instructions.join(', ') : item.instructions;
                    const cleanInstr = instrText.replace(/[\[\]']/g, ""); 
                    if(cleanInstr.trim()) {
                        instrHtml = `<span class="item-instr">WARN: ${cleanInstr.toUpperCase()}</span>`;
                    }
                }

                list.innerHTML += `
                    <div class="order-item">
                        <div>
                            <div class="item-name">${item.name.toUpperCase()}</div>
                            ${instrHtml}
                        </div>
                        <div class="item-qty">${item.quantity} ${item.unit.toUpperCase()}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
