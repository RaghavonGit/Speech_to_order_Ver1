<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Grocery Order AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5; /* Indigo */
            --primary-hover: #4338ca;
            --accent: #10b981; /* Emerald */
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            margin: 0;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            background: -webkit-linear-gradient(45deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 14px;
        }

        /* Card Container */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: #f9fafb;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Content Areas */
        .choice-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .choice-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Inputs */
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--border);
            font-family: inherit;
            font-size: 15px;
            resize: none;
            box-sizing: border-box; /* Fix padding issues */
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .file-upload-wrapper {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-upload-wrapper:hover { background: #f9fafb; }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-record { background: var(--danger); color: white; }
        
        .recording-pulse {
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-record.recording .recording-pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Results Section */
        #result-section {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed var(--border);
            padding-top: 25px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .lang-badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .raw-text-box {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 20px;
            border-left: 3px solid var(--primary);
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .order-item:last-child { border-bottom: none; }

        .item-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 16px;
        }
        
        .item-qty {
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        .item-instr {
            font-size: 12px;
            color: #ef4444; /* Red for instructions/warnings */
            background: #fef2f2;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }

        /* Loading Overlay */
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            backdrop-filter: blur(2px);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Audio Player Styling */
        audio {
            width: 100%;
            height: 40px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        
        .status-msg {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }
        .error { color: var(--danger); }
        .success { color: var(--accent); }

    </style>
</head>
<body>

<div class="main-wrapper">
    
    <div class="header">
        <h1>Smart Grocery AI</h1>
        <p>Voice-to-List for South Indian Languages</p>
    </div>

    <div class="card">
        <div id="loader" class="loader-overlay">
            <div class="spinner"></div>
            <p style="font-weight: 600; color: var(--primary);">Processing...</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab(1)">🎙️ Live</div>
            <div class="tab" onclick="switchTab(2)">📂 Upload</div>
            <div class="tab" onclick="switchTab(3)">✍️ Text</div>
        </div>

        <div id="view1" class="choice-content active">
            <div style="text-align: center; padding: 20px;">
                <p style="color: var(--text-muted); margin-bottom: 20px;">
                    Click start and speak clearly in <b>Tamil</b> or <b>Telugu</b>.
                </p>
                <button id="recordBtn" class="btn btn-record" onclick="toggleRecording()">
                    <span class="recording-pulse"></span>
                    <span id="recordText">Start Recording</span>
                </button>
            </div>
        </div>

        <div id="view2" class="choice-content">
            <div class="file-upload-wrapper" onclick="document.getElementById('fileInput').click()">
                <p style="margin:0; font-weight: 600;">Click to select audio</p>
                <p style="margin:5px 0 0; font-size:12px; color:var(--text-muted)">Supports WAV, MP3, M4A</p>
                <input type="file" id="fileInput" accept="audio/*" style="display:none" onchange="updateFileName()">
            </div>
            <p id="fileNameDisplay" style="text-align: center; font-size: 13px; margin-top: 10px; color: var(--primary);"></p>
            <button class="btn btn-primary" onclick="uploadFile()">Analyze File</button>
        </div>

        <div id="view3" class="choice-content">
            <textarea id="textInput" placeholder="Ex: Rendu packet paal, oru kilo thakkali..."></textarea>
            <button class="btn btn-primary" onclick="submitText()">Analyze Text</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div id="result-section">
            <div class="result-header">
                <h3 style="margin:0;">Receipt</h3>
                <span id="lang-badge" class="lang-badge">TAMIL</span>
            </div>

            <audio id="audio-player" controls style="display:none"></audio>

            <div id="raw-text-box" class="raw-text-box"></div>
            
            <div id="items-list">
                </div>
        </div>
    </div>
</div>

<script>
let mediaRecorder;
let audioChunks = [];
let isRecording = false;
let audioStream = null;

function switchTab(n) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n - 1));
    document.querySelectorAll('.choice-content').forEach((c, i) => c.classList.toggle('active', i === n - 1));
    // Clear status
    document.getElementById('statusMsg').innerText = '';
}

function updateFileName() {
    const file = document.getElementById('fileInput').files[0];
    if (file) document.getElementById('fileNameDisplay').innerText = file.name;
}

function setLoading(isLoading) {
    document.getElementById('loader').style.display = isLoading ? 'flex' : 'none';
    const btn = document.querySelectorAll('.btn');
    btn.forEach(b => b.disabled = isLoading);
}

function setStatus(msg, type='normal') {
    const el = document.getElementById('statusMsg');
    el.innerText = msg;
    el.className = 'status-msg ' + type;
}

// --- RECORDING LOGIC ---
async function toggleRecording() {
    const btn = document.getElementById('recordBtn');
    const txt = document.getElementById('recordText');

    if (!isRecording) {
        try {
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(audioStream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
            mediaRecorder.onstop = sendRecordedAudio;
            
            mediaRecorder.start();
            isRecording = true;
            txt.innerText = "Stop & Process";
            btn.classList.add('recording');
            setStatus("Listening...", "normal");
        } catch (err) {
            setStatus("Microphone access denied!", "error");
        }
    } else {
        mediaRecorder.stop();
        // Stop all tracks to turn off the mic light
        audioStream.getTracks().forEach(track => track.stop());
        
        isRecording = false;
        txt.innerText = "Start Recording";
        btn.classList.remove('recording');
        setStatus("Processing audio...", "normal");
    }
}

async function sendRecordedAudio() {
    setLoading(true);
    const blob = new Blob(audioChunks, { type: 'audio/wav' });
    const formData = new FormData();
    formData.append("audio", blob, "live_recording.wav");
    await sendData('/process_audio', formData);
    setLoading(false);
}

// --- FILE UPLOAD LOGIC ---
async function uploadFile() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) {
        setStatus("Please select a file first", "error");
        return;
    }
    setLoading(true);
    setStatus("Uploading and analyzing...", "normal");
    const formData = new FormData();
    formData.append("audio", file);
    await sendData('/process_audio', formData);
    setLoading(false);
}

// --- TEXT LOGIC ---
async function submitText() {
    const text = document.getElementById('textInput').value;
    if (!text.trim()) {
        setStatus("Please enter some text", "error");
        return;
    }
    setLoading(true);
    setStatus("Analyzing text...", "normal");
    
    try {
        const res = await fetch('/process_text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
        });
        const data = await res.json();
        renderResults(data);
    } catch (e) {
        setStatus("Server Error: " + e.message, "error");
    }
    setLoading(false);
}

// --- COMMON API HANDLER ---
async function sendData(url, body) {
    try {
        const res = await fetch(url, { method: 'POST', body });
        const data = await res.json();
        if (res.ok) {
            renderResults(data);
            setStatus("Analysis Complete", "success");
        } else {
            setStatus(data.error || "An error occurred", "error");
        }
    } catch (e) {
        setStatus("Network Error: Is server running?", "error");
    }
}

// --- RENDER UI ---
function renderResults(data) {
    const section = document.getElementById('result-section');
    const list = document.getElementById('items-list');
    
    section.style.display = 'block';
    
    // 1. Language Badge
    document.getElementById('lang-badge').innerText = (data.language_detected || 'UNKNOWN').toUpperCase();
    
    // 2. Translated/Raw Text
    const displayText = data.translated_text ? data.translated_text : data.raw_input;
    document.getElementById('raw-text-box').innerHTML = `"${displayText}"`;

    // 3. Audio Player
    const player = document.getElementById('audio-player');
    if (data.audio_url) {
        player.style.display = 'block';
        player.src = data.audio_url;
    } else {
        player.style.display = 'none';
    }

    // 4. Items List
    list.innerHTML = '';
    
    if (!data.items || data.items.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted)">No items found in order.</div>`;
        return;
    }

    data.items.forEach(item => {
        // Handle instructions safely (could be string or list)
        let instrHtml = '';
        if (item.instructions) {
            const instrText = Array.isArray(item.instructions) ? item.instructions.join(', ') : item.instructions;
            // Clean brackets if present from backend string conversion
            const cleanInstr = instrText.replace(/[\[\]']/g, ""); 
            if(cleanInstr.trim()) {
                instrHtml = `<div class="item-instr">⚠️ ${cleanInstr}</div>`;
            }
        }

        list.innerHTML += `
            <div class="order-item">
                <div style="flex:1">
                    <div class="item-name">${item.name}</div>
                    ${instrHtml}
                </div>
                <div class="item-qty">${item.quantity} ${item.unit}</div>
            </div>
        `;
    });
}
</script>

</body>
</html>
